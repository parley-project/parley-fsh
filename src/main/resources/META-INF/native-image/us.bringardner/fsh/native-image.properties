# fsh as a GraalVM native image (see macos/build-native.sh). reachability-metadata.json here is what the
# JDK and the other libraries need, recorded with the tracing agent (tools/record-native-config.sh); fsh's
# and parley's own classes and files are listed from the jars as the image is built (tools/native-reflect.py).
#  - slf4j (under sshd) sets itself up at build time
#  - the file system providers (sshd's rooted and sftp, parley's file source) are in the JDK's
#    installed-providers list, so they are in the image heap and must be initialized at build time
#  - parley-logging's System.LoggerFinder is found (ServiceLoader) as the image is built, and the JDK
#    asks it for its security events' logger (jdk.event.security) while it reads the trusted
#    certificates, so the finder and that logger are in the image: their classes (and LogLevel) are
#    initialized at build time. Every other logger is made as the image runs and reads parley.log.level,
#    parley.log.file and parley.log.format then; that one JDK logger keeps the defaults (WARN, text)
#  - no runtime options: -D... and -XX:... are a script's arguments, not the image's
#  - 16 MB thread stacks, as the launcher gives the JVM (-Xss16m), for deep recursion
#  - headless: a native image has no window (ConsoleFrame)
#  - a small young generation, as the launcher gives the JVM (-Xmn16m): a few tens of MB, not ~80
#  - every locale (LC_NUMERIC, LC_TIME ... as the JVM has them; a native image has only English)
#  - native access for the keyboard library and JNA, as the launcher gives the JVM (without it, GraalVM
#    24 and later warn about restricted methods on every start)
Args = --no-fallback \
       --initialize-at-build-time=org.slf4j,org.apache.commons.logging \
       --initialize-at-build-time=org.apache.sshd.common.file.root.RootedFileSystemProvider,org.apache.sshd.sftp.client.fs.SftpFileSystemProviderFacade,us.bringardner.parley.files.java.file.FileSourceFileSystemProvider \
       --initialize-at-build-time=us.bringardner.parley.logging,us.bringardner.parley.core.LogLevel \
       -H:-ParseRuntimeOptions \
       -R:StackSize=16m \
       -R:MaxNewSize=16m \
       -H:+IncludeAllLocales \
       -Djava.awt.headless=true \
       --enable-native-access=ALL-UNNAMED
