# When a release is published, the installers of fsh are built on each platform and attached to
# that release:
#
#   fsh-VERSION-macos-aarch64.pkg     fsh_VERSION_amd64.deb   fsh-VERSION-1.x86_64.rpm     fsh-VERSION-windows-x86_64.msi
#   fsh-VERSION-macos-x86_64.pkg      fsh_VERSION_arm64.deb   fsh-VERSION-1.aarch64.rpm
#
# each with a .sha256 beside it: fsh with a Java runtime of its own (tools/build-jlink.sh), made
# by tools/build-macos-pkg.sh (macOS), tools/build-linux-packages.sh and tools/build-msi.ps1. Each
# installs commands only: fsh, with the Lanterna browser plugin (fsh has its own file browser
# built in: browse, view, edit, search, from parley-files-viewer-tui), and fshdb on the same
# runtime (tools/build-installers-with-plugins.sh on macOS and Linux,
# tools/build-msi-with-plugins.ps1 on Windows). No desktop application, menu entry or shortcut:
# the window programs, Fsh Studio and parley-files-viewer, have installers of their own
# (parley-build's packaging). Run by hand (Actions > release-binaries > Run workflow) it builds
# the same and keeps them as workflow artifacts; with a tag it also attaches them to that release.
# VERSION is the tag's (v2.0.0: 2.0.0), else the pom's without -SNAPSHOT.
#
# Needs one secret, PACKAGES_TOKEN: a token that can read the Parley packages
# (https://maven.pkg.github.com/tony-bringardner/tony-bringardner), which fsh builds against; the
# workflow's own token cannot read another repository's packages. Without it the build uses the
# workflow token, which works only if those packages grant this repository access.

name: release-binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the binaries to (empty: only keep them as artifacts)'
        required: false
        default: ''

permissions:
  contents: write   # attach the files to the release
  packages: read    # the Parley dependencies

jobs:
  binary:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15,         platform: macos,   arch: aarch64 }
          - { runner: macos-15-intel,   platform: macos,   arch: x86_64 }
          # (the oldest Ubuntu offered: the Java runtime in the packages needs its glibc or later)
          - { runner: ubuntu-22.04,     platform: linux,   arch: x86_64 }
          - { runner: ubuntu-22.04-arm, platform: linux,   arch: aarch64 }
          - { runner: windows-2022,     platform: windows, arch: x86_64 }

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - uses: actions/checkout@v4

      # A JDK with jlink, and jpackage for the Windows installer (25: the AOT cache, the fastest start)
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Maven finds the Parley packages through the user's settings, as on the developer's machine
      - name: Maven settings
        shell: bash
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
          PACKAGES_USER: ${{ github.repository_owner }}
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<XML
          <settings>
            <activeProfiles><activeProfile>github</activeProfile></activeProfiles>
            <profiles>
              <profile>
                <id>github</id>
                <repositories>
                  <repository><id>central</id><url>https://repo1.maven.org/maven2</url></repository>
                  <repository>
                    <id>github</id>
                    <url>https://maven.pkg.github.com/tony-bringardner/tony-bringardner</url>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <servers>
              <server><id>github</id><username>${PACKAGES_USER}</username><password>${PACKAGES_TOKEN}</password></server>
            </servers>
          </settings>
          XML

      # fsh builds the file browser in (browse, view, edit, search): its library first, from its
      # own repository (the default branch, as the programs below); its Lanterna plugin is built
      # after fsh, by the installer scripts
      - name: Checkout the file browser
        uses: actions/checkout@v4
        with:
          repository: parley-project/parley-files-viewer-tui
          path: parley-files-viewer-tui
          token: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - name: Install the file browser's library
        shell: bash
        run: (cd parley-files-viewer-tui && mvn -B -q -DskipTests -pl parley-files-viewer-tui install)

      # parley-launcher-maven-plugin, which fsh's build runs (it writes the launcher list into the
      # jar; the Lanterna plugin's build runs it too): built from its repository, as the Parley
      # modules fsh builds against come from the packages above. (release-2.0.0 until 2.0.0 is
      # released and its default branch has it)
      - name: Checkout parley-launcher
        uses: actions/checkout@v4
        with:
          repository: parley-project/parley-launcher
          ref: release-2.0.0
          path: parley-launcher
          token: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - name: parley-launcher (its Maven plugin, which fsh's build runs)
        shell: bash
        run: mvn -B -q -DskipTests -f parley-launcher/pom.xml install

      - name: Compile (the JNI header is made from the compiled class)
        shell: bash
        run: mvn -B -q compile

      - name: Version
        shell: bash
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # ---- macOS and Linux
      # (zig's C and C++ compilers build the Linux native files for FSH_GLIBC: that glibc and every
      # later one, whatever the runner's own is)
      - name: zig (the Linux native files)
        if: matrix.platform == 'linux'
        run: python3 -m pip install --user ziglang==0.13.0 || python3 -m pip install --user --break-system-packages ziglang==0.13.0

      - name: Build the keyboard library and fshexec
        if: matrix.platform != 'windows'
        env:
          FSH_GLIBC: '2.17'
        run: sh ${{ matrix.platform }}/compile.sh

      # The installers carry more than fsh, each built from its own repository (the default
      # branch; a tag of the same name in each would pin a release): the Lanterna browser plugin
      # (from parley-files-viewer-tui, checked out above), and fshdb beside fsh (fshdb builds
      # against fsh-ide, and fsh-ide against fsh-loupe: neither is in the installers)
      - name: Checkout fsh-loupe
        uses: actions/checkout@v4
        with:
          repository: parley-project/parley-fsh-loupe
          path: fsh-loupe
          token: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - name: Checkout fsh-ide
        uses: actions/checkout@v4
        with:
          repository: parley-project/parley-fsh-ide
          path: fsh-ide
          token: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - name: Checkout fshdb
        uses: actions/checkout@v4
        with:
          repository: parley-project/parley-fshdb
          path: fshdb
          token: ${{ secrets.PACKAGES_TOKEN || github.token }}

      # (fsh with its own runtime, the plugin and fshdb, then the package or the packages)
      - name: The package
        if: matrix.platform == 'macos'
        run: >
          sh tools/build-installers-with-plugins.sh --plugins-repo parley-files-viewer-tui
          --loupe-repo fsh-loupe --ide-repo fsh-ide --db-repo fshdb
          pkg $VERSION

      - name: Smoke test (the package)
        if: matrix.platform == 'macos'
        run: |
          sudo installer -pkg dist/fsh-*.pkg -target /
          out=$(/usr/local/bin/fsh -c 'echo smoke-ok')
          echo "$out"
          test "$out" = smoke-ok
          grep -qx /usr/local/bin/fsh /etc/shells
          # commands only: no application in /Applications
          test ! -e /Applications/fsh.app
          test ! -e /Applications/Parley
          # fshdb is there, and the Lanterna browser plugin loaded
          test -x /usr/local/bin/fshdb || { echo "no /usr/local/bin/fshdb"; exit 1; }
          db=$(/usr/local/bin/fshdb --help 2>&1 || true)
          echo "$db" | grep -q 'Usage: fshdb' || { echo "fshdb: unexpected output: $db"; exit 1; }
          browsers=$(/usr/local/bin/fsh -c 'browse --list')
          echo "$browsers"
          echo "$browsers" | grep -q terminal || { echo "fsh's own file browser is not in the package"; exit 1; }
          echo "$browsers" | grep -q lanterna || { echo "the Lanterna browser plugin is not in the package"; exit 1; }

      - name: The packages
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y rpm
          sh tools/build-installers-with-plugins.sh --plugins-repo parley-files-viewer-tui \
            --loupe-repo fsh-loupe --ide-repo fsh-ide --db-repo fshdb \
            all $VERSION

      - name: Smoke test (the .deb)
        if: matrix.platform == 'linux'
        run: |
          sudo dpkg -i dist/fsh_*.deb
          out=$(/usr/bin/fsh -c 'echo smoke-ok')
          echo "$out"
          test "$out" = smoke-ok
          grep -qx /usr/bin/fsh /etc/shells
          # commands only: nothing in the desktop's application menu
          test -z "$(ls /usr/share/applications/parley-*.desktop 2>/dev/null)"
          test ! -e /etc/xdg/menus/applications-merged/parley.menu
          test ! -e /usr/bin/fshstudio
          # fshdb is there, and the Lanterna browser plugin loaded
          test -x /usr/bin/fshdb || { echo "no /usr/bin/fshdb"; exit 1; }
          /usr/bin/fshdb --help 2>&1 | grep -q 'Usage: fshdb'
          browsers=$(/usr/bin/fsh -c 'browse --list')
          echo "$browsers"
          echo "$browsers" | grep -q terminal
          echo "$browsers" | grep -q lanterna
          sudo dpkg -r fsh

      # ---- Windows
      - name: MSVC
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the keyboard library
        if: matrix.platform == 'windows'
        shell: cmd
        run: call windows\compile.cmd

      - name: The installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: >
          .\tools\build-msi-with-plugins.ps1 -Arch ${{ matrix.arch }} -Version "$env:VERSION"
          -PluginsRepo parley-files-viewer-tui -LoupeRepo fsh-loupe -IdeRepo fsh-ide
          -DbRepo fshdb

      - name: Smoke test (the installer)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\*.msi)[0].FullName
          Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'msi.log' -Wait
          $out = (& 'C:\Program Files\fsh\fsh.exe' -c 'echo smoke-ok') -join "`n"
          Write-Output $out
          if ($out.Trim() -ne 'smoke-ok') { Get-Content msi.log -Tail 40; throw "unexpected output: $out" }
          # commands only: on the system's PATH, no Start menu folder, no window program
          $path = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if (($path -split ';' | ForEach-Object { $_.TrimEnd('\') }) -notcontains 'C:\Program Files\fsh') { throw "C:\Program Files\fsh is not on the system's PATH: $path" }
          if (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Parley") { throw 'the installer made a Start menu folder' }
          foreach ($exe in 'fshstudio', 'Fsh Studio', 'parley-files-viewer') {
            if (Test-Path "C:\Program Files\fsh\$exe.exe") { throw "$exe.exe is installed" }
          }
          # fshdb is there, and the Lanterna browser plugin loaded
          if (-not (Test-Path 'C:\Program Files\fsh\fshdb.exe')) { throw 'fshdb.exe is not installed' }
          $db = (& 'C:\Program Files\fsh\fshdb.exe' --help) -join "`n"
          if ($db -notmatch 'Usage: fshdb') { throw "fshdb: unexpected output: $db" }
          $browsers = (& 'C:\Program Files\fsh\fsh.exe' -c 'browse --list') -join "`n"
          Write-Output $browsers
          if ($browsers -notmatch 'terminal') { throw "fsh's own file browser is not in the installer: $browsers" }
          if ($browsers -notmatch 'lanterna') { throw "the Lanterna browser plugin is not in the installer: $browsers" }

      # ---- every platform
      - uses: actions/upload-artifact@v4
        with:
          name: fsh-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to the release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
