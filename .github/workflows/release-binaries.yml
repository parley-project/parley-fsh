# When a release is published, a native binary of fsh is built on each platform and attached to
# that release as a separate download:
#
#   fsh-VERSION-macos-aarch64.tar.gz     fsh-VERSION-linux-x86_64.tar.gz     fsh-VERSION-windows-x86_64.zip
#   fsh-VERSION-macos-x86_64.tar.gz      fsh-VERSION-linux-aarch64.tar.gz
#
# each with a .sha256 beside it. Run by hand (Actions > release-binaries > Run workflow) it builds
# the same and keeps them as workflow artifacts; with a tag it also attaches them to that release.
#
# Needs one secret, PACKAGES_TOKEN: a token that can read the Parley packages
# (https://maven.pkg.github.com/tony-bringardner/tony-bringardner), which fsh builds against; the
# workflow's own token cannot read another repository's packages. Without it the build uses the
# workflow token, which works only if those packages grant this repository access.

name: release-binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the binaries to (empty: only keep them as artifacts)'
        required: false
        default: ''

permissions:
  contents: write   # attach the files to the release
  packages: read    # the Parley dependencies

jobs:
  binary:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15,         platform: macos,   arch: aarch64 }
          - { runner: macos-15-intel,   platform: macos,   arch: x86_64 }
          # (the oldest Ubuntu offered: the binary needs the glibc it was linked with, or later)
          - { runner: ubuntu-22.04,     platform: linux,   arch: x86_64 }
          - { runner: ubuntu-22.04-arm, platform: linux,   arch: aarch64 }
          - { runner: windows-2022,     platform: windows, arch: x86_64 }

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - uses: actions/checkout@v4

      # GraalVM 25 (Community Edition, the one the native build was tested with), with native-image
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      # Maven finds the Parley packages through the user's settings, as on the developer's machine
      - name: Maven settings
        shell: bash
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
          PACKAGES_USER: ${{ github.repository_owner }}
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<XML
          <settings>
            <activeProfiles><activeProfile>github</activeProfile></activeProfiles>
            <profiles>
              <profile>
                <id>github</id>
                <repositories>
                  <repository><id>central</id><url>https://repo1.maven.org/maven2</url></repository>
                  <repository>
                    <id>github</id>
                    <url>https://maven.pkg.github.com/tony-bringardner/tony-bringardner</url>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <servers>
              <server><id>github</id><username>${PACKAGES_USER}</username><password>${PACKAGES_TOKEN}</password></server>
            </servers>
          </settings>
          XML

      - name: Compile (the JNI header is made from the compiled class)
        shell: bash
        run: mvn -B -q compile

      # ---- macOS and Linux
      - name: Build the keyboard library and fshexec
        if: matrix.platform != 'windows'
        run: sh ${{ matrix.platform }}/compile.sh

      - name: Build the native image
        if: matrix.platform != 'windows'
        run: sh ${{ matrix.platform }}/build-native.sh

      - name: Smoke test
        if: matrix.platform != 'windows'
        run: |
          out=$(printf 'echo smoke-ok\nexit\n' | target/native/fsh)
          echo "$out"
          test "$out" = smoke-ok

      - name: Package
        if: matrix.platform != 'windows'
        run: sh tools/package-native.sh ${{ matrix.platform }} ${{ matrix.arch }} "${TAG:-${GITHUB_SHA::7}}"

      # ---- Windows
      - name: MSVC
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the keyboard library
        if: matrix.platform == 'windows'
        shell: cmd
        run: call windows\compile.cmd

      - name: Build the native image
        if: matrix.platform == 'windows'
        shell: cmd
        run: call windows\build-native.cmd

      - name: Smoke test
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $out = ("echo smoke-ok`nexit`n" | .\target\native\fsh.exe) -join "`n"
          Write-Output $out
          if ($out.Trim() -ne 'smoke-ok') { throw "unexpected output: $out" }

      - name: Package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $v = if ($env:TAG) { $env:TAG } else { $env:GITHUB_SHA.Substring(0, 7) }
          .\tools\package-native.ps1 -Arch ${{ matrix.arch }} -Version $v

      # ---- every platform
      - uses: actions/upload-artifact@v4
        with:
          name: fsh-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to the release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
