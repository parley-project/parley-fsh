# When a release is published, the installers of fsh are built on each platform and attached to
# that release:
#
#   fsh-VERSION-macos-aarch64.dmg     fsh_VERSION_amd64.deb   fsh-VERSION-1.x86_64.rpm     fsh-VERSION-windows-x86_64.msi
#   fsh-VERSION-macos-x86_64.dmg      fsh_VERSION_arm64.deb   fsh-VERSION-1.aarch64.rpm
#
# each with a .sha256 beside it: fsh with a Java runtime of its own (tools/build-jlink.sh), made
# by tools/build-jpackage.sh (macOS), tools/build-linux-packages.sh and tools/build-msi.ps1. Run
# by hand (Actions > release-binaries > Run workflow) it builds the same and keeps them as workflow
# artifacts; with a tag it also attaches them to that release. VERSION is the tag's (v2.0.0:
# 2.0.0), else the pom's without -SNAPSHOT.
#
# Needs one secret, PACKAGES_TOKEN: a token that can read the Parley packages
# (https://maven.pkg.github.com/tony-bringardner/tony-bringardner), which fsh builds against; the
# workflow's own token cannot read another repository's packages. Without it the build uses the
# workflow token, which works only if those packages grant this repository access.

name: release-binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the binaries to (empty: only keep them as artifacts)'
        required: false
        default: ''

permissions:
  contents: write   # attach the files to the release
  packages: read    # the Parley dependencies

jobs:
  binary:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15,         platform: macos,   arch: aarch64 }
          - { runner: macos-15-intel,   platform: macos,   arch: x86_64 }
          # (the oldest Ubuntu offered: the keyboard library and fshexec need the glibc they were
          # linked with, or later)
          - { runner: ubuntu-22.04,     platform: linux,   arch: x86_64 }
          - { runner: ubuntu-22.04-arm, platform: linux,   arch: aarch64 }
          - { runner: windows-2022,     platform: windows, arch: x86_64 }

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - uses: actions/checkout@v4

      # A JDK with jlink and jpackage (25: the AOT cache, the fastest start)
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Maven finds the Parley packages through the user's settings, as on the developer's machine
      - name: Maven settings
        shell: bash
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
          PACKAGES_USER: ${{ github.repository_owner }}
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<XML
          <settings>
            <activeProfiles><activeProfile>github</activeProfile></activeProfiles>
            <profiles>
              <profile>
                <id>github</id>
                <repositories>
                  <repository><id>central</id><url>https://repo1.maven.org/maven2</url></repository>
                  <repository>
                    <id>github</id>
                    <url>https://maven.pkg.github.com/tony-bringardner/tony-bringardner</url>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <servers>
              <server><id>github</id><username>${PACKAGES_USER}</username><password>${PACKAGES_TOKEN}</password></server>
            </servers>
          </settings>
          XML

      - name: Compile (the JNI header is made from the compiled class)
        shell: bash
        run: mvn -B -q compile

      - name: Version
        shell: bash
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # ---- macOS and Linux
      - name: Build the keyboard library and fshexec
        if: matrix.platform != 'windows'
        run: sh ${{ matrix.platform }}/compile.sh

      - name: Build fsh with its own runtime
        if: matrix.platform != 'windows'
        run: sh tools/build-jlink.sh

      - name: The disk image
        if: matrix.platform == 'macos'
        run: sh tools/build-jpackage.sh dmg $VERSION

      - name: Smoke test (the disk image)
        if: matrix.platform == 'macos'
        run: |
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -mountpoint "$mnt" dist/fsh-*.dmg
          out=$("$mnt/fsh.app/Contents/app/fsh" -c 'echo smoke-ok')
          hdiutil detach "$mnt"
          echo "$out"
          test "$out" = smoke-ok

      - name: The packages
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y rpm
          sh tools/build-linux-packages.sh all $VERSION

      - name: Smoke test (the .deb)
        if: matrix.platform == 'linux'
        run: |
          sudo dpkg -i dist/fsh_*.deb
          out=$(/usr/bin/fsh -c 'echo smoke-ok')
          echo "$out"
          test "$out" = smoke-ok
          grep -qx /usr/bin/fsh /etc/shells
          sudo dpkg -r fsh

      # ---- Windows
      - name: MSVC
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the keyboard library
        if: matrix.platform == 'windows'
        shell: cmd
        run: call windows\compile.cmd

      # The installer carries more than fsh, each built from its own repository (the default
      # branch; a tag of the same name in each would pin a release): the file browser plugin
      # (browse, view, edit, search), and the programs beside fsh.exe: fsh-ide, fshdb and
      # parley-files-viewer (fsh-loupe is fsh-ide's dependency)
      - name: Checkout the file browser plugin
        if: matrix.platform == 'windows'
        uses: actions/checkout@v4
        with:
          repository: parley-project/parley-files-viewer-tui
          path: parley-files-viewer-tui
          token: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - name: Checkout fsh-loupe
        if: matrix.platform == 'windows'
        uses: actions/checkout@v4
        with:
          repository: parley-project/parley-fsh-loupe
          path: fsh-loupe
          token: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - name: Checkout fsh-ide
        if: matrix.platform == 'windows'
        uses: actions/checkout@v4
        with:
          repository: parley-project/parley-fsh-ide
          path: fsh-ide
          token: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - name: Checkout fshdb
        if: matrix.platform == 'windows'
        uses: actions/checkout@v4
        with:
          repository: parley-project/parley-fshdb
          path: fshdb
          token: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - name: Checkout parley-files-viewer
        if: matrix.platform == 'windows'
        uses: actions/checkout@v4
        with:
          repository: parley-project/parley-files-viewer
          path: parley-files-viewer
          token: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - name: The installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: >
          .\tools\build-msi-with-plugins.ps1 -Arch ${{ matrix.arch }} -Version "$env:VERSION"
          -PluginsRepo parley-files-viewer-tui -LoupeRepo fsh-loupe -IdeRepo fsh-ide
          -DbRepo fshdb -ViewerRepo parley-files-viewer

      - name: Smoke test (the installer)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\*.msi)[0].FullName
          Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'msi.log' -Wait
          $out = (& 'C:\Program Files\fsh\fsh.exe' -c 'echo smoke-ok') -join "`n"
          Write-Output $out
          if ($out.Trim() -ne 'smoke-ok') { Get-Content msi.log -Tail 40; throw "unexpected output: $out" }
          # the other programs are there, and the browser plugin loaded
          foreach ($exe in 'fsh-ide', 'fshdb', 'parley-files-viewer') {
            if (-not (Test-Path "C:\Program Files\fsh\$exe.exe")) { throw "$exe.exe is not installed" }
          }
          $db = (& 'C:\Program Files\fsh\fshdb.exe' --help) -join "`n"
          if ($db -notmatch 'Usage: fshdb') { throw "fshdb: unexpected output: $db" }
          $browsers = (& 'C:\Program Files\fsh\fsh.exe' -c 'browse --list') -join "`n"
          Write-Output $browsers
          if ($browsers -notmatch 'lanterna') { throw "the file browser plugin is not in the installer: $browsers" }

      # ---- every platform
      - uses: actions/upload-artifact@v4
        with:
          name: fsh-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to the release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
